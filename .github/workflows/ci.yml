name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Database for the Bruno run. Tests use Testcontainers instead. Throwaway CI-only credentials.
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: homebuild
          POSTGRES_USER: homebuild
          POSTGRES_PASSWORD: homebuild-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homebuild -d homebuild"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      # Migrations run as the table owner; the API runs as homebuild_app, which row-level security applies to.
      MIGRATIONS_CONNECTION: Host=localhost;Port=5432;Database=homebuild;Username=homebuild;Password=homebuild-ci
      ConnectionStrings__HomeBuild: Host=localhost;Port=5432;Database=homebuild;Username=homebuild_app;Password=homebuild-ci-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1      # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: No project disables warnings-as-errors
        run: "! grep -rniE --include='*.csproj' '<TreatWarningsAsErrors>false' ."
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      - name: Test layers, timed against their budgets (docs/testing.md)
        run: scripts/test-layers.sh
      - name: Tailwind CSS was generated by the build and is not committed
        run: |
          css=src/HomeBuild.Web/wwwroot/app.css
          head -c 80 "$css"; echo
          grep -q '.rounded-card' "$css"
          test -z "$(git ls-files "$css")"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1     # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api-tests/package-lock.json
      - run: npm ci
        working-directory: api-tests
      - run: dotnet tool restore
      - name: Build migration bundles and idempotent scripts
        run: |
          for context in Catalogue Sales Accounts Construction; do
            name=$(echo "$context" | tr '[:upper:]' '[:lower:]')
            dotnet ef migrations bundle --project src/HomeBuild.Api --context ${context}DbContext --configuration Release \
              --self-contained --target-runtime linux-x64 --output artifacts/migrate-$name --force
            dotnet ef migrations script --idempotent --no-build --configuration Release --project src/HomeBuild.Api \
              --context ${context}DbContext --output artifacts/migrate-$name.sql
          done
      - name: Apply each bundle twice to the empty CI database
        run: |
          for run in 1 2; do
            for name in catalogue sales accounts construction; do
              echo "::group::run $run: migrate-$name"
              ./artifacts/migrate-$name --connection "$MIGRATIONS_CONNECTION"
              echo "::endgroup::"
            done
          done
      - name: Give the application role a login (CI-only password)
        env:
          PGPASSWORD: homebuild-ci
        run: psql -h localhost -U homebuild -d homebuild -c "ALTER ROLE homebuild_app LOGIN PASSWORD 'homebuild-ci-app'"
      - name: Publish migration bundles and scripts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: migrations
          path: artifacts/
      - name: Issue test tokens (dotnet user-jwts, a local test issuer; CI cannot sign in to Cognito)
        run: |
          api-tests/tokens.sh homebuild-ci > tokens.env
          key=$(dotnet user-jwts key --project src/HomeBuild.Api | sed -E "s/^Signing Key: '(.*)'$/\1/")
          while IFS='=' read -r name value; do echo "::add-mask::$value"; done < tokens.env
          echo "::add-mask::$key"
          cat tokens.env >> "$GITHUB_ENV"
          echo "TEST_ISSUER_KEY=$key" >> "$GITHUB_ENV"
          rm tokens.env
      - name: Start the API
        env:
          ASPNETCORE_ENVIRONMENT: CI
          # Trust the test issuer only in CI (dotnet user-jwts' issuer name, its key, and the CI client).
          Authentication__Schemes__Bearer__ValidIssuer: dotnet-user-jwts
          Authentication__Schemes__Bearer__SigningKeys__0__Issuer: dotnet-user-jwts
          Authentication__Schemes__Bearer__SigningKeys__0__Value: ${{ env.TEST_ISSUER_KEY }}
          Tokens__AllowedClientIds__0: homebuild-ci
        run: |
          dotnet run --no-build -c Release --no-launch-profile --project src/HomeBuild.Api --urls http://localhost:5080 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:5080/openapi/v1.json && exit 0; sleep 1; done
          cat api.log; exit 1
      - name: Start the web app
        env:
          ASPNETCORE_ENVIRONMENT: CI
          CatalogueApi__BaseAddress: http://localhost:5080/v2/
          # CI cannot sign in to Cognito: placeholders so the OIDC handler starts; only anonymous pages are smoke-tested.
          Authentication__Cognito__Authority: https://cognito-idp.eu-west-2.amazonaws.com/eu-west-2_ci
          Authentication__Cognito__ClientId: homebuild-ci
        run: |
          dotnet run --no-build -c Release --no-launch-profile --project src/HomeBuild.Web --urls http://localhost:5090 > web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:5090/ && exit 0; sleep 1; done
          cat web.log; exit 1
      - name: Bruno collection
        # The main collection, the red-team folder (every attack must fail) and the web smoke test.
        run: |
          start=$SECONDS
          npm run test:ci -- --env-var "accessToken=$BRUNO_ACCESS_TOKEN" --env-var "buyer2Token=$BRUNO_BUYER2_TOKEN" \
            --env-var "idToken=$BRUNO_ID_TOKEN" --env-var "forgedAdminToken=$BRUNO_FORGED_ADMIN_TOKEN"
          printf '%s\n' "| Layer | Time | Budget |" "| --- | --- | --- |" \
            "| API acceptance (Bruno, running API and web app) | $((SECONDS - start)) s | 60 s |" >> "$GITHUB_STEP_SUMMARY"
        working-directory: api-tests
      - name: Publish Bruno JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bruno-junit
          path: api-tests/results/junit.xml
          if-no-files-found: ignore
