version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # NuGet: one weekly PR for every minor and patch update (majors still come one by one).
  # Fixing a PR that fails `dotnet restore --locked-mode`: see CONTRIBUTING.md.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The source generator's Roslyn must not be newer than the SDK's compiler; updated by hand with the SDK
      # (see CONTRIBUTING.md). Dependabot also tried to lift EF Core Design's transitive copy, which breaks NU1608.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"

  # npm: the Bruno CLI that runs the API acceptance collection in CI.
  - package-ecosystem: npm
    directory: /api-tests
    schedule:
      interval: weekly
