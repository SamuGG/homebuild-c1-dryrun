info:
  name: Anonymous cannot read reservations
  type: http
  seq: 15

http:
  method: GET
  url: "{{host}}{{victimReservation}}"
  headers:
    - name: Authorization
      value: ""

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
