info:
  name: SQL injection in search (drop table)
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/units/search?q=river'); DROP TABLE catalogue.units; --"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
