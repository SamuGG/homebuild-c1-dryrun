info:
  name: BOLA signed photo URLs of another buyers snag
  type: http
  seq: 24

http:
  method: GET
  url: "{{baseUrlV2}}/snags/{{victimSnag}}/photos"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
