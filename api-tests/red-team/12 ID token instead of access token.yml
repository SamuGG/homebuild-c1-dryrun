info:
  name: ID token instead of access token
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/me"
  headers:
    - name: Authorization
      value: Bearer {{idToken}}

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
