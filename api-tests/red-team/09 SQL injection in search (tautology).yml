info:
  name: SQL injection in search (tautology)
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/units/search?q=x' OR '1'='1"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.items
      operator: length
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
