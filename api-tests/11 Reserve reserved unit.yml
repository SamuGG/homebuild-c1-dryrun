info:
  name: Reserve reserved unit
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/units/{{unitId}}/reservations"
  body:
    type: json
    data: |-
      {
        "buyerId": "11111111-1111-1111-1111-111111111111",
        "deposit": 5000,
        "currency": "GBP"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.type
      operator: eq
      value: https://homebuild.dev/problems/unit-unavailable
    - expression: res.body.traceId
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
