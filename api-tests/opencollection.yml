opencollection: 1.0.0

info:
  name: HomeBuild API

request:
  headers:
    - name: X-Tenant-Id
      value: "{{tenantId}}"
    - name: Authorization
      value: Bearer {{accessToken}}
    # C8 Lab 3: a fresh UUID per request, like a well-behaved client; the reservation POSTs require one.
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
      - results
