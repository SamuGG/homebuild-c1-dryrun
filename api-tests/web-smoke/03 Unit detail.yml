info:
  name: 03 Unit detail
  type: http
  seq: 3

http:
  method: GET
  url: "{{webUrl}}/units/{{riversidePlot3}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("renders >Plot P3</h1>", function () {
          expect(res.body).to.contain(">Plot P3</h1>");
        });

        test("is static SSR: no interactive component markers", function () {
          expect(res.body).not.to.contain("<!--Blazor:{");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers["content-type"]
      operator: contains
      value: text/html

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
