info:
  name: 01 Development list
  type: http
  seq: 1

http:
  method: GET
  url: "{{webUrl}}/"

runtime:
  scripts:
    - type: tests
      code: |-
        test("renders homes available", function () {
          expect(res.body).to.contain("homes available");
        });

        test("is static SSR: no interactive component markers", function () {
          expect(res.body).not.to.contain("<!--Blazor:{");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers["content-type"]
      operator: contains
      value: text/html

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
