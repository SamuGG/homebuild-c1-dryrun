info:
  name: Get unit with default ID
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/units/00000000-0000-0000-0000-000000000000"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.title
      operator: eq
      value: Invalid unit ID

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
