info:
  name: List units v2 first page
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseUrlV2}}/developments/{{riverside}}/units?size=2"

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("unitsCursor", res.body.next);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.items
      operator: length
      value: "2"
    - expression: res.body.next
      operator: isString
    - expression: res.body.total
      operator: isUndefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
