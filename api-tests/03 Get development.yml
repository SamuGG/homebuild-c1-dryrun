info:
  name: Get development
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/developments/{{riverside}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.name
      operator: eq
      value: Riverside

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
