info:
  name: Get unit v2
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrlV2}}/units/{{unitId}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "{{unitId}}"
    - expression: res.body.price.amount
      operator: isNumber
    - expression: res.body.price.currency
      operator: eq
      value: GBP
    - expression: res.headers.deprecation
      operator: isUndefined
    - expression: res.headers.sunset
      operator: isUndefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
