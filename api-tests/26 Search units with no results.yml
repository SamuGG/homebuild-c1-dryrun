info:
  name: Search units with no results
  type: http
  seq: 26

http:
  method: GET
  url: "{{baseUrl}}/units/search?q=penthouse"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.items
      operator: length
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
