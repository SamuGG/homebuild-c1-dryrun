info:
  name: List developments
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/developments?page=1&size=10"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.total
      operator: eq
      value: "2"
    - expression: res.body.page
      operator: eq
      value: "1"
    - expression: res.body.items
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
