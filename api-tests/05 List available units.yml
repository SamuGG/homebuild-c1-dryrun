info:
  name: List available units
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/developments/{{riverside}}/units?status=Available"

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("unitId", res.body[0].id);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray
    - expression: res.body[0].status
      operator: eq
      value: Available

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
