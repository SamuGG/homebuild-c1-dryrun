info:
  name: Get unit
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/units/{{unitId}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "{{unitId}}"
    - expression: res.body.price
      operator: isNumber
    - expression: res.body.currency
      operator: eq
      value: GBP

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
