info:
  name: Read reservation
  type: http
  seq: 14

http:
  method: GET
  url: "{{host}}{{reservationPath}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.state
      operator: eq
      value: Held

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
